<!doctype html>
<html lang="es">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metfly</title>

</head>
<body>
  <header>
        <div class="contenedor">
            <h2 class="logo">Metfly</h2>
            <nav>
                <a href="index.html" id="login">Volver al inicio</a>
            </nav>
        </div>
    </header>

  <div>
        <form id="loginForm">
            <h2>Iniciar sesión</h2>
            <div class="mb-3">
                <label for="usuarios" class="form-label">Usuario:</label>
                <input name="usuarios" autocomplete="username" class="form-control" id="usuarios" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña:</label>
                <input type="password" name="password" class="form-control" id="password" required>
            </div>
            <div class="link-login">
                <a class="link-login" href=""> ¿Olvidaste tu contraseña? </a><br>
                <p>¿No tienes una cuenta? <a class="link-login" href="">Regístrate aquí</a></p>
            </div>
            
            <p id="mensaje" class="text-danger text-center mt-2 fw-bold"></p>
            
            <button type="submit" id="botonlogin" class="btn btn-danger w-100" disabled>Iniciar sesión</button>
        </form>
    </div>

    <footer class= "bg-dark text-white text-center py-3 mt-4">
        <p class ="mb-0">© 2026 Metfly - Todos los derechos reservados</p>
    </footer>

    <script src="script.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const campoUsuario = document.getElementById('usuarios');
        const campoPassword = document.getElementById('password');
        const botonIngresar = document.getElementById('botonlogin');
        const mensaje = document.getElementById('mensaje'); 

        let usuarios = [];
        let listo = false;

        async function cargarUsuarios() {
            try {

                const respuesta = await fetch('./usuarios.json'); 
                if (!respuesta.ok) {
                    throw new Error('No se pudo cargar el archivo de usuarios');
                }
                usuarios = await respuesta.json();
                listo = true;
                botonIngresar.disabled = false;
                mensaje.textContent = '';
            } catch (error) {
                mensaje.textContent = 'Error de conexión. Intenta más tarde.';
                console.error(error);
            }
        }

        function manejarLogin(evento) {
            evento.preventDefault();
            if (!listo) return;

            const encontrado = usuarios.find(persona =>
                persona.usuarios === campoUsuario.value.trim() &&
                persona.password === campoPassword.value &&
                persona.activo === true
            );

            if (encontrado) {
                localStorage.setItem('usuarioLogeado', 'true');
                window.location.href = 'index.html'; 
            } else {
                campoPassword.value = '';
                mensaje.textContent = 'Usuario o contraseña incorrectos.';
            }
        }
        loginForm.addEventListener('submit', manejarLogin);
        cargarUsuarios();
    </script>
</body>
</html>
