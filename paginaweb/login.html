<!doctype html>
<html lang="es">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metfly</title>

</head>
<body>
  <header>
        <div class="contenedor">
            <h2 class="logo">Metfly</h2>
            <nav>
                <a href="index.html" id="login">Volver al inicio</a>
            </nav>
        </div>
    </header>

    <div x-data="loginAlpine()">
    <form @submit.prevent="iniciarSesion" id="loginForm" novalidate>
        <h2>Iniciar sesión</h2>
        <div class="mb-3">
            <label for="usuarios" class="form-label">Usuario:</label>
            <input id="usuarios" type="text" x-model="usuario" class="form-control" required :class="errores.usuario ? 'is-invalid' : ''">
            <div class="invalid-feedback" x-text="errores.usuario"></div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña:</label>
            <input id="password" type="password" x-model="password" class="form-control" required :class="errores.password ? 'is-invalid' : ''">
            <div class="invalid-feedback" x-text="errores.password"></div>
        </div>
        <div class="link-login">
            <a class="link-login" href="">¿Olvidaste tu contraseña?</a><br>
            <p>¿No tienes una cuenta? <a class="link-login" href="">Regístrate aquí</a></p>
        </div>
        
        <p x-text="mensaje" class="text-center mt-2 fw-bold" :class="exito ? 'text-success' : 'text-danger'"></p>
        
        <button type="submit" class="btn btn-danger w-100" :disabled="cargando">Iniciar sesión</button>
    </form>
</div>

    <footer class= "bg-dark text-white text-center py-3 mt-4">
        <p class ="mb-0">© 2026 Metfly - Todos los derechos reservados</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
